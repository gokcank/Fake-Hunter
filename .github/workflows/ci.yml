name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Validate shell scripts syntax
        run: |
          sh -n scripts/fake_hunter.sh
          bash -n scripts/fake_hunter_adb.sh

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Run Unit Tests, Lint, and Build Both Flavors
        run: ./gradlew test lintModernDebug lintClassicDebug assembleModernDebug assembleClassicDebug

      - name: Enforce Zero-Internet and Zero-Storage-Permission Policy
        run: |
          FOUND_MANIFESTS=0
          for mf in $(find app/build/intermediates/merged_manifests -name "AndroidManifest.xml"); do
            FOUND_MANIFESTS=$((FOUND_MANIFESTS + 1))
            if grep -E "android\.permission\.(INTERNET|ACCESS_NETWORK_STATE|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE)" "$mf"; then
              echo "ERROR: Forbidden network or storage permission found in $mf!" >&2
              exit 1
            fi
          done
          if [ "$FOUND_MANIFESTS" -lt 2 ]; then
            echo "ERROR: Expected merged manifests for both flavors, found $FOUND_MANIFESTS." >&2
            exit 1
          fi
          echo "Verified $FOUND_MANIFESTS merged manifests: zero network or storage permissions."
