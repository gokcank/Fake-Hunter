name: Release APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APKs
      run: ./gradlew assembleModernRelease assembleClassicRelease

    - name: Prepare Release Artifacts
      run: |
        mkdir -p release-apks
        cp app/build/outputs/apk/modern/release/app-modern-release.apk release-apks/FakeHunter-${{ github.ref_name }}-Modern.apk
        cp app/build/outputs/apk/classic/release/app-classic-release.apk release-apks/FakeHunter-${{ github.ref_name }}-Classic.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release-apks/FakeHunter-${{ github.ref_name }}-Modern.apk
          release-apks/FakeHunter-${{ github.ref_name }}-Classic.apk
        generate_release_notes: true
