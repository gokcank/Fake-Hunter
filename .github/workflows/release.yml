name: Release APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing version tag to release (e.g. v1.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Resolve and validate release tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            TAG="$INPUT_TAG"
          fi
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*)
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "ERROR: Release tag '$TAG' must match v<major>.<minor>.<patch>." >&2
              exit 1
              ;;
          esac

      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Validate shell scripts syntax
        run: |
          sh -n scripts/fake_hunter.sh
          bash -n scripts/fake_hunter_adb.sh

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Verify Unit Tests and Android Lint
        run: ./gradlew test lintModernDebug lintClassicDebug

      - name: Build Release APKs
        run: ./gradlew assembleModernRelease assembleClassicRelease

      - name: Enforce Zero-Internet Policy on Release Manifests
        run: |
          FOUND_MANIFESTS=0
          for mf in $(find app/build/intermediates/merged_manifests -path "*Release*" -name "AndroidManifest.xml"); do
            FOUND_MANIFESTS=$((FOUND_MANIFESTS + 1))
            if grep -E "android\.permission\.(INTERNET|ACCESS_NETWORK_STATE|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE)" "$mf"; then
              echo "ERROR: Forbidden permission found in release manifest $mf!" >&2
              exit 1
            fi
          done
          [ "$FOUND_MANIFESTS" -ge 2 ]

      - name: Prepare Release Artifacts and SHA-256 Checksums
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/modern/release/app-modern-release.apk "release-assets/FakeHunter-${TAG}-Modern.apk"
          cp app/build/outputs/apk/classic/release/app-classic-release.apk "release-assets/FakeHunter-${TAG}-Classic.apk"
          cp scripts/fake_hunter.sh "release-assets/fake_hunter.sh"
          cp scripts/fake_hunter_adb.sh "release-assets/fake_hunter_adb.sh"
          (
            cd release-assets
            sha256sum "FakeHunter-${TAG}-Modern.apk" "FakeHunter-${TAG}-Classic.apk" fake_hunter.sh fake_hunter_adb.sh > SHA256SUMS.txt
          )

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: |
            release-assets/FakeHunter-${{ steps.meta.outputs.tag }}-Modern.apk
            release-assets/FakeHunter-${{ steps.meta.outputs.tag }}-Classic.apk
            release-assets/fake_hunter.sh
            release-assets/fake_hunter_adb.sh
            release-assets/SHA256SUMS.txt
          generate_release_notes: true
          make_latest: true
